name: ✅ CI - Build, Lint & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Permisos para que el workflow pueda escribir checks en los Pull Requests
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Usar Node.js 24 para eliminar la advertencia de obsolescencia.
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Run Linting
        # Se ejecuta el linting pero no se trata como un error fatal para no bloquear el pipeline
        run: npm run lint
        env:
          # Esta variable de entorno le dice a Next.js que no trate las advertencias de ESLint como errores durante el build.
          NEXT_ESLINT_WARNINGS_AS_ERRORS: "false"

      - name: 5. Run Tests
        run: npm test -- --passWithNoTests # El workflow no fallará si no hay tests
        env:
          # URL de base de datos dummy para que los tests que importan Prisma no fallen
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"

      - name: 6. Build Project
        run: npm run build
        env:
          # URL de base de datos dummy para que el build de Prisma no falle
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"