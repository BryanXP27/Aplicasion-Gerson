name: CI - Gerson App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Usamos npm ya que no hay pnpm-lock.yaml

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Run Linting
        run: npm run lint

      - name: 5. Run Tests
        run: npm run test
        env:
          # Se necesita una URL de base de datos dummy para que los tests que importan prisma no fallen
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"

      - name: 6. Build Project
        run: npm run build
        env:
          # Se necesita una URL de base de datos dummy para que el build de prisma no falle
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"