# ============================================================================
# GOOGLE CLOUD BUILD - Despliegue de Pollería Gerson en Cloud Run
# ============================================================================
timeout: 1200s

options:
  substitutionOption: ALLOW_LOOSE
  machineType: 'N1_HIGHCPU_8'

steps:
  # Paso 1: Build de la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Docker Build'
    args: [
      'build',
      '-t', 'us-central1-docker.pkg.dev/polleria-gerson/polleria-gerson/polleria-gerson:latest',
      '-t', 'us-central1-docker.pkg.dev/polleria-gerson/polleria-gerson/polleria-gerson:${COMMIT_SHA}',
      '.'
    ]

  # Paso 2: Subir imagen a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Docker Push'
    args: [
      'push',
      'us-central1-docker.pkg.dev/polleria-gerson/polleria-gerson/polleria-gerson:latest'
    ]

  # Paso 3: Desplegar en Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Cloud Run Deploy'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'polleria-gerson'
      - '--image'
      - 'us-central1-docker.pkg.dev/polleria-gerson/polleria-gerson/polleria-gerson:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '10'

images:
  - 'us-central1-docker.pkg.dev/polleria-gerson/polleria-gerson/polleria-gerson:latest'
  - 'us-central1-docker.pkg.dev/polleria-gerson/polleria-gerson/polleria-gerson:${COMMIT_SHA}'