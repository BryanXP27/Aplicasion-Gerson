  # ==================== LOGGING: Loki ====================
  loki:
    image: grafana/loki:latest
    container_name: gerson_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - gerson_network

  # ==================== LOG COLLECTOR: Promtail ====================
  promtail:
    image: grafana/promtail:latest
    container_name: gerson_promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/app/logs
    command: -config.file=/etc/promtail/config.yml
    networks:
      - gerson_network
    depends_on:
      - loki

  # ==================== METRICS: Prometheus ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: gerson_prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - gerson_network

  # ==================== VISUALIZATION: Grafana ====================
  grafana:
    image: grafana/grafana:latest
    container_name: gerson_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning
    networks:
      - gerson_network
    depends_on:
      - prometheus
      - loki

  # ==================== ALERTING: AlertManager ====================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: gerson_alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/config.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    networks:
      - gerson_network

