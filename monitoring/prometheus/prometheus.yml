global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "polleria-app"
    metrics_path: "/api/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:3000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "polleria-web"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cadvisor"
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: "node-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:9100"]
